<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Words Cannon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--page:#efe9fb;--ink:#2a1740;--panel:#2a1740;--panel-ink:#fff;--gold:#ffd23f;--mint:#3ddc97;--coral:#ff5d73;--steel:#9fb3c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#150b22;--ink:#f1e9ff}}
:root[data-theme="dark"]{--page:#150b22;--ink:#f1e9ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
main{width:100%;max-width:860px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:1.05rem;margin-bottom:8px;flex-wrap:wrap}
.pips{display:inline-flex;gap:6px;vertical-align:middle;margin-left:6px}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--coral);background:transparent}
.pip.on{background:var(--coral)}
#prompt{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:12px 18px;text-align:center;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:600;margin-bottom:8px}
#prompt small{display:block;font-size:.85rem;font-weight:400;color:var(--steel);margin-top:2px;min-height:1.2em}
#prompt small.ok{color:var(--mint)} #prompt small.bad{color:var(--coral)}
.stage{position:relative}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:var(--panel);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:rgba(42,23,64,.93);color:#fff;border-radius:14px;padding:24px}
.overlay[hidden]{display:none}
.overlay h1{margin:0;font-size:clamp(1.8rem,6vw,3rem)}
.overlay p{margin:0;max-width:34ch;color:var(--steel);font-size:1.05rem;line-height:1.4}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 26px;background:var(--gold);color:#2a1740;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pad{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pad button{flex:1;max-width:200px;user-select:none;-webkit-user-select:none;touch-action:none}
.keys{text-align:center;font-size:.9rem;margin-top:8px;opacity:.8}
#mute{background:transparent;color:inherit;border:2px solid currentColor;padding:4px 12px;font-weight:400}
</style>
</head>
<body>
<main>
  <div class="hud">
    <span>Level <b id="round">1</b>/6 &nbsp;Correct <b id="prog">0</b>/5</span>
    <span>Mistakes<span class="pips" id="pips"></span></span>
    <span>Score <b id="score">0</b></span>
    <button id="mute" aria-pressed="false">Sound on</button>
  </div>
  <div id="prompt">Get ready<small></small></div>
  <div class="stage">
    <canvas id="c" width="800" height="520" aria-label="Game area"></canvas>
    <div class="overlay" id="ov">
      <h1 id="ovT">Question Words Cannon</h1>
      <p id="ovP">Read the Spanish question, then shoot the correct English translation. Get 5 correct answers to reach the next level. Each level is faster. The 3rd mistake ends the game.</p>
      <button id="go">Start game</button>
    </div>
  </div>
  <div class="pad">
    <button id="bL" aria-label="Move left">◀</button>
    <button id="bF" aria-label="Fire">Fire</button>
    <button id="bR" aria-label="Move right">▶</button>
  </div>
  <div class="keys">Move with ← → keys. Shoot with the spacebar.</div>
</main>
<script>
/* 30 present-simple questions, 6 levels of 5 (ordered easy to harder) */
const DATA=[
["¿Dónde vives?","Where do you live?",["When do you live?","How do you live?","What do you live?"]],
["¿Cómo estás?","How are you?",["Where are you?","When are you?","What are you?"]],
["¿Qué es esto?","What is this?",["Where is this?","How is this?","When is this?"]],
["¿Dónde está el baño?","Where is the bathroom?",["When is the bathroom?","What is the bathroom?","How is the bathroom?"]],
["¿Qué hora es?","What time is it?",["Where is it?","When is it?","How is it?"]],
["¿Cuándo es tu cumpleaños?","When is your birthday?",["Where is your birthday?","How is your birthday?","What is your birthday?"]],
["¿Cuándo estudias?","When do you study?",["Where do you study?","How do you study?","What do you study?"]],
["¿Dónde trabaja tu mamá?","Where does your mom work?",["When does your mom work?","How does your mom work?","What does your mom work?"]],
["¿Qué quieres beber?","What do you want to drink?",["Where do you want to drink?","When do you want to drink?","How do you want to drink?"]],
["¿A qué hora empieza la clase?","What time does the class start?",["Where does the class start?","How does the class start?","Which time does the class start?"]],
["¿Cómo vas a la escuela?","How do you go to school?",["Where do you go to school?","When do you go to school?","What do you go to school?"]],
["¿Cuándo comes el desayuno?","When do you eat breakfast?",["Where do you eat breakfast?","How do you eat breakfast?","What do you eat breakfast?"]],
["¿Qué comes en el desayuno?","What do you eat for breakfast?",["Where do you eat for breakfast?","When do you eat for breakfast?","How do you eat for breakfast?"]],
["¿Dónde juegas fútbol?","Where do you play soccer?",["When do you play soccer?","How do you play soccer?","What do you play soccer?"]],
["¿Cuál camiseta prefieres?","Which shirt do you prefer?",["How do you prefer the shirt?","When do you prefer the shirt?","Where do you prefer the shirt?"]],
["¿A qué hora te levantas?","What time do you get up?",["Where do you get up?","How do you get up?","Which time do you get up?"]],
["¿Dónde estudia tu hermano?","Where does your brother study?",["When does your brother study?","How does your brother study?","What does your brother study?"]],
["¿Cómo va tu papá al trabajo?","How does your dad go to work?",["Where does your dad go to work?","When does your dad go to work?","What does your dad go to work?"]],
["¿Cuándo tienes inglés?","When do you have English?",["Where do you have English?","How do you have English?","Which do you have English?"]],
["¿Cuál de estos libros es tuyo?","Which of these books is yours?",["What of these books is yours?","Where are these books yours?","How are these books yours?"]],
["¿Qué hace tu hermana los sábados?","What does your sister do on Saturdays?",["Where does your sister do on Saturdays?","How does your sister do on Saturdays?","When does your sister do on Saturdays?"]],
["¿A qué hora almuerzas?","What time do you have lunch?",["Where do you have lunch?","How do you have lunch?","Which time do you have lunch?"]],
["¿Dónde viven tus abuelos?","Where do your grandparents live?",["When do your grandparents live?","How do your grandparents live?","What do your grandparents live?"]],
["¿Cuándo juegan tus amigos?","When do your friends play?",["Where do your friends play?","How do your friends play?","What do your friends play?"]],
["¿Cómo se escribe tu nombre?","How do you spell your name?",["What do you spell your name?","Where do you spell your name?","When do you spell your name?"]],
["¿Qué te gusta comer?","What do you like to eat?",["Where do you like to eat?","When do you like to eat?","How do you like to eat?"]],
["¿Cuál mochila es tuya?","Which backpack is yours?",["Where is your backpack?","How is your backpack?","When is your backpack?"]],
["¿A qué hora termina la escuela?","What time does school finish?",["Where does school finish?","How does school finish?","When time does school finish?"]],
["¿Dónde compra pan tu mamá?","Where does your mom buy bread?",["When does your mom buy bread?","How does your mom buy bread?","What does your mom buy bread?"]],
["¿Cómo estudia inglés tu amiga?","How does your friend study English?",["Where does your friend study English?","When does your friend study English?","What does your friend study English?"]]
];
const TIPS={"What time":"What time = a qué hora","Where":"Where = dónde","How":"How = cómo","When":"When = cuándo","Which":"Which = cuál","What":"What = qué"};
const tipFor=t=>TIPS[Object.keys(TIPS).find(k=>t.startsWith(k))];
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d"),W=800,H=520;
const LANES=[70,150,230,310],TW=210,TH=58;

/* ---------- sound ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f1,f2,dur,type,vol,delay){const a=ac();if(!a||muted)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol){const a=ac();if(!a||muted)return;const n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
f.type="highpass";f.frequency.value=1200;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start()}
const SFX={
fire(){noise(.09,.35);tone(900,160,.13,"sawtooth",.12)},
good(){[523,659,784].forEach((f,i)=>tone(f,f,.14,"triangle",.25,i*.09))},
bad(){tone(180,70,.4,"sawtooth",.22);tone(150,60,.4,"square",.1)},
win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,.2,"square",.14,i*.12))},
up(){[440,554,659,880].forEach((f,i)=>tone(f,f,.15,"square",.12,i*.08))},
lose(){[392,330,262,196,130].forEach((f,i)=>tone(f,f*.9,.3,"sawtooth",.17,i*.2))}};

/* ---------- state ---------- */
let G,keys={},last=0,running=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function newGame(){G={qs:Array.from({length:6},(_,l)=>shuffle(DATA.slice(l*5,l*5+5))).flat(),i:0,mistakes:0,score:0,x:W/2,spin:0,bullets:[],targets:[],cool:0,lock:0,parts:[],over:false};
loadQ();pips();$("score").textContent=0}
function loadQ(){const q=G.qs[G.i];$("round").textContent=Math.floor(G.i/5)+1;$("prog").textContent=G.i%5;
$("prompt").innerHTML=q[0]+"<small>Shoot the correct English translation</small>";
const opts=shuffle([[q[1],true],...q[2].map(t=>[t,false])]),lanes=shuffle(LANES.slice());
G.targets=opts.map((o,k)=>({t:o[0],ok:o[1],x:80+Math.random()*(W-160-TW),y:lanes[k],vx:(k%2?1:-1)*(55+Math.random()*60)*(.7+Math.floor(G.i/5)*.3),flash:0}));
G.bullets=[]}
function pips(){$("pips").innerHTML=[0,1,2].map(i=>`<i class="pip${G.mistakes>i?" on":""}"></i>`).join("")}
function note(msg,cls){const s=document.querySelector("#prompt small");s.textContent=msg;s.className=cls}
function fire(){if(!running||G.lock>0||G.cool>0)return;G.cool=.28;G.bullets.push({x:G.x,y:H-90});SFX.fire();G.spin+=1.2}

function burst(x,y,col){for(let i=0;i<16;i++)G.parts.push({x,y,vx:(Math.random()-.5)*320,vy:(Math.random()-.5)*320,l:.6,c:col})}

function hit(t){
if(t.ok){G.score++;$("score").textContent=G.score;$("prog").textContent=G.i%5+1;SFX.good();burst(t.x+TW/2,t.y,"#3ddc97");t.flash=1;
note("Correct! "+tipFor(t.t),"ok");G.lock=1.3;G.done=true;
G.next=()=>{G.i++;if(G.i>=G.qs.length)end(true);else{loadQ();if(G.i%5===0){SFX.up();note("Level "+(G.i/5+1)+": faster targets!","ok")}}}}
else{G.mistakes++;pips();SFX.bad();burst(t.x+TW/2,t.y,"#ff5d73");t.dead=true;
note("Not this one. Look at the question word.","bad");
if(G.mistakes>=3)end(false)}}

function end(won){G.over=true;running=false;if(won)SFX.win();else SFX.lose();
$("ovT").textContent=won?"You win!":"Game over";
$("ovP").textContent=won?`You finished all 6 levels with ${G.mistakes} mistake${G.mistakes===1?"":"s"}. Great question words!`:`That was your 3rd mistake. You reached level ${Math.floor(G.i/5)+1} with ${G.score} correct answers. Try again!`;
$("go").textContent="Play again";setTimeout(()=>$("ov").hidden=false,won?500:700)}

/* ---------- loop ---------- */
function update(dt){
const sp=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);G.x=Math.max(50,Math.min(W-50,G.x+sp*380*dt));
if(keys[" "])fire();
G.cool-=dt;G.spin+=dt*(G.cool>0?18:2);
if(G.lock>0){G.lock-=dt;if(G.lock<=0&&G.next){const n=G.next;G.next=null;G.done=false;n()}}
G.targets.forEach(t=>{if(t.dead)return;if(!G.done||t.ok===false){t.x+=t.vx*dt;if(t.x<10){t.x=10;t.vx=Math.abs(t.vx)}if(t.x>W-TW-10){t.x=W-TW-10;t.vx=-Math.abs(t.vx)}}});
G.targets=G.targets.filter(t=>!t.dead||false);
G.bullets.forEach(b=>{b.y-=760*dt;if(G.done)return;for(const t of G.targets){if(b.x>t.x&&b.x<t.x+TW&&b.y>t.y-TH/2&&b.y<t.y+TH/2){b.y=-99;hit(t);break}}});
G.bullets=G.bullets.filter(b=>b.y>-20);
G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});G.parts=G.parts.filter(p=>p.l>0)}

function wrap(text,max){const w=text.split(" "),L=[];let c="";w.forEach(x=>{const n=c?c+" "+x:x;if(ctx.measureText(n).width>max&&c){L.push(c);c=x}else c=n});L.push(c);return L}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}

function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#2a1740";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(255,255,255,.06)";ctx.lineWidth=1;
LANES.forEach(y=>{ctx.beginPath();ctx.moveTo(0,y+TH/2+8);ctx.lineTo(W,y+TH/2+8);ctx.stroke()});
ctx.font="600 17px Fredoka,system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
G.targets.forEach(t=>{
 const win=G.done&&t.ok;
 ctx.fillStyle=win?"#3ddc97":"#ffd23f";rr(t.x,t.y-TH/2,TW,TH,14);ctx.fill();
 ctx.fillStyle="#2a1740";const L=wrap(t.t,TW-24);
 L.forEach((l,i)=>ctx.fillText(l,t.x+TW/2,t.y+(i-(L.length-1)/2)*20))});
ctx.fillStyle="#fff";G.bullets.forEach(b=>{rr(b.x-3,b.y-12,6,22,3);ctx.fill()});
G.parts.forEach(p=>{ctx.globalAlpha=Math.max(p.l/.6,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)});ctx.globalAlpha=1;
cannon()}

function cannon(){
const x=G.x,y=H-52,kick=G.cool>.2?4:0;
ctx.fillStyle="#5b4a78";rr(x-44,y+14,88,30,10);ctx.fill();
ctx.fillStyle="#7a679c";rr(x-30,y-6,60,30,8);ctx.fill();
ctx.save();ctx.translate(x,y-12+kick);
ctx.fillStyle="#9fb3c8";rr(-26,-52,52,60,8);ctx.fill();
for(let i=0;i<6;i++){const a=G.spin+i*Math.PI/3,bx=Math.cos(a)*15,sh=Math.sin(a);
 ctx.fillStyle=sh>0?"#d6e2ee":"#6f8296";rr(bx-5,-60-sh*2,10,50,4);ctx.fill()}
ctx.fillStyle="#2a1740";ctx.fillRect(-26,-8,52,4);
ctx.restore()}

function frame(ts){if(!last)last=ts;const dt=Math.min((ts-last)/1000,.05);last=ts;
if(G&&(running||G.parts.length||G.over)){if(running||G.over)update(dt)}
if(G)draw();requestAnimationFrame(frame)}

/* ---------- input ---------- */
addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key)){e.preventDefault()}
 if(!$("ov").hidden&&(e.key==="Enter"||e.key===" ")&&!e.repeat){start();return}
 keys[e.key]=true});
addEventListener("keyup",e=>keys[e.key]=false);
function hold(id,key){const b=$(id);const on=e=>{e.preventDefault();ac();keys[key]=true},off=()=>keys[key]=false;
 b.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,off))}
hold("bL","ArrowLeft");hold("bR","ArrowRight");hold("bF"," ");
function start(){ac();newGame();running=true;$("ov").hidden=true;keys={}}
$("go").addEventListener("click",start);
$("mute").addEventListener("click",e=>{muted=!muted;e.target.textContent=muted?"Sound off":"Sound on";e.target.setAttribute("aria-pressed",muted)});
newGame();running=false;G.targets.forEach(t=>t.vx*=.6);
requestAnimationFrame(frame);
</script>
</body>
</html>
